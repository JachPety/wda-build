name: Build WebDriverAgent (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Checkout Appium WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master

      - name: Build WDA (no code signing)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          cd build/Build/Products/Debug-iphoneos
          rm -rf Payload WDA-unsigned.ipa
          mkdir -p Payload
          cp -R WebDriverAgentRunner-Runner.app Payload/
          zip -qry WDA-unsigned.ipa Payload
          ls -la WDA-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa
          path: build/Build/Products/Debug-iphoneos/WDA-unsigned.ipa
          if-no-files-found: error
